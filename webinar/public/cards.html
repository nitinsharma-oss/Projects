<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage — cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/stage.css">
<style>
  .cards-page { max-width: 900px; margin: 0 auto; padding: 26px 20px 60px; }
  .url { font-family: var(--data); font-size: 11.5px; word-break: break-all; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="cards-page">
  <div class="row-between" style="margin-bottom:20px">
    <div class="stack" style="gap:4px">
      <span class="eyebrow">Cards</span>
      <h1>Enrolment and tag writing</h1>
    </div>
    <div class="row">
      <a class="btn ghost small" href="/station">Station</a>
      <a class="btn ghost small" href="/admin">Admin</a>
    </div>
  </div>

  <div id="alert"></div>

  <div class="panel stack" style="margin-bottom:22px">
    <span class="eyebrow">Enrol a card</span>
    <div class="grid grid-2">
      <label><span>Belongs to</span><select id="f-user"></select></label>
      <label><span>Card number (optional)</span>
        <div class="row">
          <input id="f-uid" class="mono" placeholder="04A1B2C3D4E5F6">
          <button class="btn ghost small" id="capture" hidden>Scan</button>
        </div>
      </label>
    </div>
    <label><span>Label</span><input id="f-label" placeholder="Front desk spare 01"></label>
    <p class="muted" style="font-size:13px;margin:0">
      Leave the card number blank if you only plan to use the tap-a-URL route. Fill it in
      to also allow check-in from a desk reader.
    </p>
    <div class="row"><button class="btn" id="enrol">Enrol card</button></div>
  </div>

  <h2 style="margin-bottom:12px">Enrolled cards</h2>
  <div class="grid" id="list">Loading…</div>
</div>

<script type="module">
import { api, requireSession, fmtDate, esc, el, notify } from '/stage.js';

let people = [];
let cards = [];

const nfcSupported = 'NDEFReader' in window;

async function load() {
  const [{ people: p }, { cards: c }] = await Promise.all([api('/admin/people'), api('/admin/cards')]);
  people = p; cards = c;
  el('f-user').innerHTML = people.map((u) => `<option value="${u.id}">${esc(u.name)} — ${esc(u.email)}</option>`).join('');
  render();
}

function render() {
  el('list').innerHTML = cards.length
    ? cards.map((c) => `
      <article class="card" data-state="${c.revoked ? 'cancelled' : 'scheduled'}">
        <div class="row-between">
          <h3>${esc(c.holder?.name || 'Unassigned')}</h3>
          <span class="badge" data-state="${c.revoked ? 'cancelled' : 'scheduled'}">${c.revoked ? 'revoked' : 'active'}</span>
        </div>
        <div class="meta">
          <span>${esc(c.label)}</span>
          <span>${c.uid ? esc(c.uid) : 'no card number'}</span>
          <span>${c.taps} tap${c.taps === 1 ? '' : 's'}</span>
          <span>enrolled ${fmtDate(c.createdAt)}</span>
        </div>
        <div class="url">${esc(c.tapUrl)}</div>
        ${c.revoked ? '' : `<div class="row" style="flex-wrap:wrap">
          ${nfcSupported ? `<button class="btn small" data-write="${c.id}">Write to tag</button>` : ''}
          <button class="btn ghost small" data-copy="${c.id}">Copy URL</button>
          <button class="btn danger small" data-revoke="${c.id}">Revoke</button>
        </div>`}
      </article>`).join('')
    : '<div class="empty"><strong>No cards yet</strong><span>Enrol one above, then write the URL to a blank NTAG.</span></div>';
}

/* ---------- enrolment ---------- */

el('enrol').onclick = async () => {
  try {
    await api('/admin/cards', { method: 'POST', body: {
      userId: el('f-user').value, uid: el('f-uid').value, label: el('f-label').value,
    }});
    el('f-uid').value = ''; el('f-label').value = '';
    notify(el('alert'), 'Card enrolled. Write the URL to a tag below.', 'ok');
    await load();
  } catch (err) {
    notify(el('alert'), err.message);
  }
};

/* ---------- capture a UID by scanning ---------- */

if (nfcSupported) {
  el('capture').hidden = false;
  el('capture').onclick = async () => {
    try {
      const reader = new NDEFReader();
      await reader.scan();
      notify(el('alert'), 'Hold a card against the phone.', 'ok');
      reader.onreading = ({ serialNumber }) => {
        el('f-uid').value = serialNumber.replace(/[^0-9a-fA-F]/g, '').toUpperCase();
        notify(el('alert'), `Read card ${el('f-uid').value}.`, 'ok');
      };
    } catch (err) {
      notify(el('alert'), `NFC couldn\u2019t start: ${err.message}`);
    }
  };
}

/* ---------- writing tags ----------
   One NDEF record, type "url". That single record is what makes the tag readable
   by both platforms with no app: iOS surfaces it as a notification banner, Android
   opens it directly. Anything more exotic on the tag loses that.                */

el('list').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const card = cards.find((c) => c.id === (btn.dataset.write || btn.dataset.copy || btn.dataset.revoke));

  try {
    if (btn.dataset.copy) {
      await navigator.clipboard.writeText(card.tapUrl);
      notify(el('alert'), 'URL copied. Paste it into NFC Tools if you\u2019re writing tags on a phone.', 'ok');
    }

    if (btn.dataset.write) {
      btn.disabled = true;
      notify(el('alert'), 'Hold a blank tag against the phone…', 'ok');
      const writer = new NDEFReader();
      await writer.write({ records: [{ recordType: 'url', data: card.tapUrl }] });
      notify(el('alert'), `Written to tag for ${card.holder?.name}. Test it before handing it over.`, 'ok');
      btn.disabled = false;
    }

    if (btn.dataset.revoke) {
      if (!confirm(`Revoke ${card.label}? Taps from it stop working immediately.`)) return;
      await api(`/admin/cards/${card.id}`, { method: 'DELETE' });
      await load();
    }
  } catch (err) {
    notify(el('alert'), err.message);
    btn.disabled = false;
  }
});

/* ---------- boot ---------- */

const user = await requireSession({ admin: true });
if (user) {
  if (!nfcSupported) {
    notify(el('alert'), 'This browser can\u2019t write tags (Web NFC is Chrome on Android). Copy each URL and write it with the NFC Tools app or a USB writer.');
  }
  await load();
}
</script>
</body>
</html>
